# ============================================
# Aegis Configuration File
# ============================================
# 所有配置项集中管理，启动时由后端和脚本统一读取。
# 修改后重启服务生效。

# ── 服务器设置 ──────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000
  debug: false

# ── 数据库设置 ──────────────────────────────
database:
  url: "sqlite+aiosqlite:///./data/aegis.db"

# ── 远程服务设置 ────────────────────────────
remote:
  api_base_url: "http://localhost:8000/api/v1/tasks"

# ── 技能设置 ────────────────────────────────
skills:
  dir: "skills"

# ── 强化学习训练设置 ────────────────────────
training:
  max_trajectory_steps: 10
  replay_buffer_size: 10000
  batch_size: 32
  discount_factor: 0.99

# ── SSE 设置 ────────────────────────────────
sse:
  ping_interval: 30

# ── 多模态记忆压缩设置 ──────────────────────
memory:
  max_tokens: 4000
  compress_on_add: true
  compress_on_get: true
  protected_pairs: 2

# ── 向量数据库设置 ──────────────────────────
vector:
  chroma_persist_dir: "data/chroma_db"
  max_context_tokens: 128000

# ── 双层检索设置 (Dual-Level Retrieval) ─────
retrieval:
  enabled: true             # 启用 / 禁用 检索增强
  coarse_k: 50              # BM25 粗检索候选数
  fine_k: 50                # 语义精排候选数
  rrf_k: 60                 # RRF 平滑常数 (默认 60)
  top_k: 3                  # 注入上下文的最终结果数


opentouter:
  api_key: "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"
